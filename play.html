<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23d9481f'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='monospace'%3Et%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tiny-py playground</title>
<link rel="stylesheet" href="tiny/tiny.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<header class="top">
<span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
<span class="wordmark">tiny-py</span>
<span class="tagline">playground — free code, live preview</span>
<a class="btn" href="index.html">Home</a>
<a class="btn" href="learn.html">Learn</a>
</header>
<main id="layout">
<section id="left">
<div class="panel">
<div class="panel-head">CODE
<span class="filerow">
<select id="file-list" aria-label="Saved files"><option value="">My files…</option></select>
<button class="btn" id="btn-file-save">Save file</button>
<button class="btn" id="btn-file-del">Delete</button>
<button class="btn" id="btn-max-code" aria-label="Maximize"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</span>
</div>
<div class="editor-wrap">
<pre id="highlight" aria-hidden="true"></pre>
<textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea>
</div>
<div id="toolbar">
<button class="btn primary" id="btn-run">Run</button>
<button class="btn" id="btn-undo" disabled>↩ Undo</button>
<button class="btn" id="btn-redo" disabled>Redo ↪</button>
<button class="btn" id="btn-reset">Reset</button>
<button class="btn" id="btn-share">Share</button>
<button class="btn" id="btn-save">Download</button>
<span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
</div>
</div>
<div class="panel" id="images-panel">
<div class="panel-head">IMAGES<span class="key-hint">png · jpg · gif</span><button class="btn" id="btn-img-add">Add</button><input type="file" id="img-file" accept="image/*" hidden></div>
<div id="img-list"></div>
</div>
</section>
<section id="right">
<div class="panel">
<div class="panel-head"><span class="live-dot" aria-hidden="true"></span>PREVIEW<span class="key-hint" id="keyhint" hidden>click the stage, then play</span><button class="btn" id="btn-max-preview" aria-label="Maximize"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button></div>
<iframe id="preview" sandbox="allow-scripts" title="live preview"></iframe>
</div>
<div class="panel" id="console-panel">
<div class="panel-head">CONSOLE<span class="cout-hint">print() lands here</span><button class="btn" id="btn-clear">Clear</button></div>
<pre id="cout" aria-live="polite"></pre>
<div id="cinrow" hidden><span id="cprompt">input:</span><input id="cin" type="text" autocomplete="off" aria-label="Type your answer and press Send"><button class="btn" id="btn-send">Send</button></div>
</div>
</section>
</main>
<footer id="assistant" aria-live="polite" hidden></footer>
<script src="tiny/tiny.js"></script>
<script src="tiny/tiny-tags.js"></script>
<script src="tiny/tiny-game.js"></script>
<script src="app/editor.js"></script>
<script src="app/complete.js"></script>
<script src="app/highlight.js"></script>
<script src="app/tinypy.js"></script>
<script src="app/preview.js"></script>
<script src="app/console.js"></script>
<script src="app/assistant.js"></script>
<script src="app/files.js"></script>
<script src="app/images.js"></script>
<script src="app/max.js"></script>
</body>
</html>
